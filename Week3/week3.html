<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | DMMMSU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <div class="header">
      <img src="picture.png" alt="DMMMSU Logo" class="logo">
      <h2>Don Mariano Marcos Memorial State University</h2>
    </div>

    <div class="menu">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
      <a href="#">Register</a>
    </div>

    <div class="content">
      <form action="#" method="post">
        <h3>Login Form</h3>

        <div class="form-group">
          <label for="username">Username:</label>
          <input id="username" name="username" type="text" required>
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input id="password" name="password" type="password" required>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn">Login</button>
        </div>
      </form>
    </div>

    <div class="content1">
      <img src="campus.jpg" alt="DMMMSU campus sign">
    </div>

    <div class="footer">
      <p>2024 Don Mariano Marcos Memorial State University. All rights reserved.</p>
    </div>

  </div>
</body>
</html>
